spring.application.name=feedback-engine
server.port=8083
spring.config.import=classpath:policy.yaml

# Default: file-based H2 in PostgreSQL mode, so skill data survives restarts with no setup.
# Use the "postgres" profile for PostgreSQL (see application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/feedback-engine;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
