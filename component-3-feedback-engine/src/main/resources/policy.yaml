# Adaptive Security Coach decision policy.
# All weights, thresholds and mastery parameters live here so they can be tuned
# without recompiling. Override at runtime with:
#   --spring.config.additional-location=file:./my-policy.yaml
#
# Version history
#   1.0.0  starting values from the Adaptive Security Coach plan
#   1.1.0  tuned on the 32 tuning scenarios only (see PolicyTuningTest):
#          L2 threshold 30 -> 25, mastered-threshold 0.75 -> 0.65,
#          reopened fixes count toward repeat pressure
#   1.2.0  adds fatigue-aware delivery (Plan B): interruption budget, cooldown,
#          de-escalation after quick fixes; scoring unchanged from 1.1.0
policy:
  version: 1.2.0

  # Priority score P = severity*S + repeat*Rn + ignore*In + weakness*(1 - M) + recency*Rec
  weights:
    severity: 35
    repeat: 20
    ignore: 20
    weakness: 15
    recency: 10

  # Repeats/ignores in the last 30 days at which the pressure term saturates at 1.0
  pressure-saturation: 3

  # Count reopened fixes (fix did not hold) as repeats in the repeat-pressure term
  reopens-count-as-repeats: true

  # Recency term: 1.0 within full-days, 0.5 within half-days, otherwise 0
  recency:
    full-days: 7
    half-days: 14

  # Minimum score for each level; anything below l2 is L1
  levels:
    l2: 25
    l3: 55
    l4: 80

  mastery:
    initial: 0.5
    fix-gain: 0.25
    ignore-loss: 0.15
    repeat-loss: 0.30
    reopen-loss: 0.20
    half-life-days: 30
    mastered-threshold: 0.65

  # Hard floors applied last, so no other rule can lower them
  overrides:
    - cwe: CWE-798          # hardcoded secrets
      min-level: 3
      reason: Hardcoded credentials are dangerous even on the first occurrence
    - severity: CRITICAL
      min-level: 2
      reason: Critical findings always get at least guided feedback

  # Alert-fatigue controls: they lower the delivery channel, never the warning itself
  fatigue:
    interrupts-per-hour: 3        # popups/panels per developer per hour before quieter delivery
    cooldown-minutes: 10          # same CWE in the same file is not re-popped within this window
    quick-dismiss-seconds: 2      # closed faster than this without expanding = quick dismissal
    quick-fix-minutes: 10         # a fix within this time counts as a quick fix
    de-escalation-quick-fixes: 3  # this many quick fixes in a row lower the level by one
    exempt-cwes: [CWE-798]        # never quietened
    exempt-severities: [CRITICAL] # never quietened
